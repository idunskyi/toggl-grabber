name: Pull Toggl snapshot

on:
  schedule:
    # GitHub Actions cron is always UTC. 6 PM at UTC+4 = 14:00 UTC.
    # Runs Fridays only (day-of-week 5). Scheduled runs can be delayed 5–15 min.
    - cron: "0 14 * * 5"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the snapshot back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Pull last 7 days (all projects)
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
        run: python3 pull_toggl.py --project all

      - name: Commit snapshot if it changed
        run: |
          git config user.name "toggl-bot"
          git config user.email "toggl-bot@users.noreply.github.com"
          git add -f toggl_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Toggl snapshot [skip ci]"
            git push
          fi
